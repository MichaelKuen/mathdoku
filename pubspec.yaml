name: mathdoku
description: "A fun, child-friendly 4x4 Mathdoku math puzzle game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_animate: ^4.5.2
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.4
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/nunito/OFL.txt

  # Nunito, bundled so the app never downloads fonts at runtime.
  # Subset to Latin text and the math symbols.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-400.ttf
        - asset: assets/fonts/nunito/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-900.ttf
          weight: 900
