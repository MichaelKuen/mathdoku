<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the value of `flutter build web --base-href`.
    The live build is served from /play/mathdoku/.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play Mathdoku online — a fun math puzzle game for kids. Free to play, no download required.">
  <meta name="theme-color" content="#F6F3EC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mathdoku">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mathdoku by App Verse Games">
  <meta property="og:description" content="Play Mathdoku online — a fun math puzzle game for kids. Free to play, no download required.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:url" content="https://appversegames.com/mathdoku/">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mathdoku by App Verse Games</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F6F3EC;
    }

    /* Shown until the game has started (removed in flutter_bootstrap.js). */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #16193A;
    }

    #loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(22, 25, 58, 0.15);
      border-top-color: #F2A541;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="spinner"></div>
    <div>Loading Mathdoku…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
